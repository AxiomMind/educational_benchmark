[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chis-eval"
version = "0.1.0"
description = "Auditable data pipeline prototype for the CHisEval history benchmark"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "CHisEval contributors"}]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "lxml>=5,<7",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
pdf = [
  "PyMuPDF>=1.24,<2",
  "pdfplumber>=0.11,<1",
]
ocr = [
  "paddleocr>=2.8,<4",
]
dev = [
  "pytest>=8,<10",
]

[project.scripts]
chis-eval = "chis_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

<!doctype html>
<html lang="zh-CN">
  <body>
    <section class="question-group">
      <div class="material">材料：某时期，国家加强了中央集权。</div>
      <article class="question-block">
        <h3 class="stem">1．这一措施的主要影响是（　　）</h3>
        <ul>
          <li class="option" data-option="A">A. 加强中央控制</li>
          <li class="option" data-option="B">B. 扩大地方割据</li>
          <li class="option" data-option="C">C. 取消行政机构</li>
          <li class="option" data-option="D">D. 结束农业生产</li>
        </ul>
        <span class="answer">答案：A</span>
      </article>
      <article class="question-block">
        <h3 class="stem">2. 材料反映的制度特征是</h3>
        <ul>
          <li class="option" data-option="A">权力分散</li>
          <li class="option" data-option="B">中央集权</li>
          <li class="option" data-option="C">贵族自治</li>
          <li class="option" data-option="D">地方独立</li>
        </ul>
        <span class="answer">B</span>
      </article>
    </section>
    <section class="question-group">
      <article class="question-block">
        <h3 class="stem">3、下列说法正确的是</h3>
        <ul>
          <li class="option">A）甲</li>
          <li class="option">B）乙</li>
          <li class="option">C）丙</li>
          <li class="option">D）丁</li>
        </ul>
      </article>
    </section>
  </body>
</html>
